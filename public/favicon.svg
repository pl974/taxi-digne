<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond bleu taxi -->
  <rect width="100" height="100" fill="#0066cc" rx="20"/>

  <!-- Taxi stylisé -->
  <g transform="translate(20, 35)">
    <!-- Carrosserie -->
    <rect x="5" y="15" width="50" height="20" fill="#FFD700" rx="3"/>

    <!-- Toit/Cabine -->
    <path d="M 15 15 L 20 5 L 40 5 L 45 15 Z" fill="#FFD700"/>

    <!-- Fenêtres -->
    <rect x="22" y="7" width="8" height="6" fill="#1a1a1a"/>
    <rect x="32" y="7" width="8" height="6" fill="#1a1a1a"/>

    <!-- Roues -->
    <circle cx="15" cy="35" r="5" fill="#1a1a1a"/>
    <circle cx="15" cy="35" r="2.5" fill="#666"/>
    <circle cx="45" cy="35" r="5" fill="#1a1a1a"/>
    <circle cx="45" cy="35" r="2.5" fill="#666"/>

    <!-- Phares -->
    <circle cx="57" cy="22" r="2" fill="#fff" opacity="0.9"/>

    <!-- Ligne décorative -->
    <rect x="8" y="25" width="44" height="1" fill="#1a1a1a" opacity="0.3"/>
  </g>

  <!-- Texte "T" stylisé -->
  <text x="50" y="78" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">TAXI</text>
</svg>
